<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión — Wasakaka</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdf8ef;
      font-family: system-ui, -apple-system, sans-serif;
      color: #4a2c17;
      text-align: center;
      padding: 24px;
    }
    .caja { max-width: 420px; }
    .icono { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; color: #d05a1e; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 20px; color: #7a5a42; }
    button {
      background: #d05a1e;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="caja">
    <div class="icono">🍲</div>
    <h1>Sin conexión</h1>
    <p>Wasakaka necesita internet para mostrarte los platos frescos del barrio. Revisa tu conexión y vuelve a intentar.</p>
    <button onclick="location.reload()">Intentar de nuevo</button>
  </div>
</body>
</html>
